[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-feature-engineering"
version = "0.1.0"
description = "MF-OpenFE: automatic feature engineering, meta-filtered"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # >=1.3 for sklearn.preprocessing.TargetEncoder; <1.6 because openfe 0.0.12
    # calls mean_squared_error(..., squared=False), removed in sklearn 1.6.
    "scikit-learn>=1.3,<1.6",
    "openfe>=0.0.12",
    "lightgbm>=4.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Only needed for the benchmark/comparison harness (afe.benchmark, dev/) --
# not required to run afe.MFOpenFE itself.
benchmark = [
    "pyarrow>=14.0",
    "openml>=0.14",
    "ucimlrepo>=0.0.7",
    "kaggle>=1.6",
    "featuretools>=1.31",
    "autofeat>=2.1",
    "matplotlib>=3.8",
    "setuptools<81",  # featuretools/woodwork still import pkg_resources
]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["afe", "afe.*"]

[tool.setuptools.package-data]
"afe.benchmark" = ["manifests/*.json"]
