[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-feature-engineering"
version = "0.1.0"
description = "A fair, algorithm-agnostic benchmark harness for automatic feature engineering methods"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",  # >=1.3 for sklearn.preprocessing.TargetEncoder
    "lightgbm>=4.0",      # the "tree" arm of the 3-model scoring panel
]

[project.optional-dependencies]
# Only needed to fetch the built-in 22-dataset suite. Benchmarking your own
# method against your own data needs nothing beyond the core dependencies.
datasets = [
    "pyarrow>=14.0",
    "openml>=0.14",
    "ucimlrepo>=0.0.7",
    "kaggle>=1.6",
]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["afe", "afe.*"]

[tool.setuptools.package-data]
"afe.benchmark" = ["manifests/*.json"]
